<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="estilos/style.css">
  <title>Projeto Login</title>
</head>
<body>
  <main>
    <section id="login">
      <div id="imagem">
        <p></p>
      </div>
      <div id="formulario">
        <h1>Login</h1>

        <p>
          Seja Bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.
        </p>

        <form action="login.py" method="post" autocomplete="on">

          <div id="dados">
            <label for="iemail">E-mail</label>
            <input class="email" type="email" name="email" id="iemail" placeholder="Digite seu e-mail" required>
            <br>
            <label for="isenha">Senha</label>
            <input class="senha" type="password" name="senha" id="isenha" placeholder="Digite a senha aqui">
            <br>
          </div>

          <div id="botoes">
            <input class="enviar" type="button" value="Enviar">
            <input class="limpar" type="reset" value="Limpar">
          </div>
          <br>
          <input class="esqueciasenha" type="button" value="Esqueci minha senha">
        </form>
      </div>
    </section>
  </main>
</body>
</html>
